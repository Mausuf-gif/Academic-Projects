<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Review</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Review {{ course.course_name }}</h1>
        <form action="{{ url_for('submit_review', course_id=course.id) }}" method="POST">
            <div class="form-group">
                <label for="rating">Rating (1-5)</label>
                <select id="rating" name="rating" class="form-control" required>
                    <option value="1">1 - Poor</option>
                    <option value="2">2 - Fair</option>
                    <option value="3">3 - Good</option>
                    <option value="4">4 - Very Good</option>
                    <option value="5">5 - Excellent</option>
                </select>
            </div>
            <div class="form-group">
                <label for="review">Review</label>
                <textarea id="review" name="review" class="form-control" rows="4" placeholder="Share your experience"></textarea>
            </div>
            <button type="submit" class="btn btn-success">Submit Review</button>
        </form>
        <a href="{{ url_for('your_courses') }}" class="btn btn-secondary mt-3">Back to Your Courses</a>
    </div>
</body>
</html>
