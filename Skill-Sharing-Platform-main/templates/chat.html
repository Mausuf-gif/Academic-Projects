<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with {{ recipient.name }}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .chat-container {
            max-width: 800px;
            margin: 20px auto;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        .messages {
            height: 300px;
            overflow-y: scroll;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: white;
        }
        .message {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>Chat with {{ recipient.name }}</h2>
        <div class="messages" id="messages">
            {% for msg in messages %}
                <div class="message {% if msg.sender_id == current_user.id %}text-right{% else %}text-left{% endif %}">
                    <strong>{{ msg.sender.name if msg.sender_id != current_user.id else 'You' }}</strong>: {{ msg.message }}
                    <small class="text-muted d-block">{{ msg.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</small>
                </div>
            {% endfor %}
        </div>
        <form id="chat-form">
            <input type="text" id="message-input" class="form-control" placeholder="Type your message..." required>
            <button type="submit" class="btn btn-primary mt-2">Send</button>
        </form>
    </div>

    <script>
        const socket = io.connect(window.location.origin);
        const room = "{{ current_user.id }}-{{ recipient.id }}";
        const username = "{{ current_user.name }}";

        // Join the chat room
        socket.emit('join', { room: room, username: username });

        const messages = document.getElementById('messages');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('message-input');

        // Listen for messages
        socket.on('message', function(data) {
            const messageElement = document.createElement('div');
            messageElement.className = 'message';
            messageElement.textContent = data.msg;
            messages.appendChild(messageElement);
            messages.scrollTop = messages.scrollHeight;
        });

        // Send a message
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const message = input.value;
            socket.emit('message', { room: room, username: username, message: message });
            input.value = '';
        });
    </script>
</body>
</html>
