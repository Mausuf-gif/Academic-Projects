<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.6/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.6/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #calendar {
            max-width: 900px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <h1>Interactive Calendar</h1>
    <div id="calendar"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                editable: true,
                selectable: true,
                events: '/calendar/events', // Fetch events from the backend
                eventClick: function (info) {
                    if (confirm('Do you want to delete this event?')) {
                        axios.delete(`/calendar/events/${info.event.id}`)
                            .then(response => {
                                alert(response.data.message);
                                calendar.refetchEvents();
                            })
                            .catch(error => {
                                alert('Error deleting event');
                                console.error(error);
                            });
                    }
                },
                dateClick: function (info) {
                    const title = prompt('Enter event title:');
                    const description = prompt('Enter event description:');
                    const start = info.dateStr;
                    const end = new Date(info.date.getTime() + (60 * 60 * 1000)).toISOString(); // Default 1-hour event

                    if (title) {
                        axios.post('/calendar/events', {
                            title: title,
                            description: description,
                            start: start,
                            end: end
                        })
                        .then(response => {
                            alert(response.data.message);
                            calendar.refetchEvents();
                        })
                        .catch(error => {
                            alert('Error adding event');
                            console.error(error);
                        });
                    }
                }
            });

            calendar.render();
        });
    </script>
</body>
</html>
