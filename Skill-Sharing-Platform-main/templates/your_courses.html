<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Courses</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Your Courses</h1>
        <ul class="list-group">
            {% for course in purchased_courses %}
                <li class="list-group-item">
                    <h5><strong>{{ course.course.course_name }}</strong></h5>
                    <p>{{ course.course.description }}</p>
                    <p><strong>Duration:</strong> {{ course.course.duration }} | <strong>Level:</strong> {{ course.course.skill_level }}</p>
                    <div class="d-flex">
                        <!-- Delete Button -->
                        <form action="{{ url_for('delete_course', course_id=course.course.id) }}" method="POST" class="mr-2" onsubmit="return confirm('Are you sure you want to delete this course?');">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                        <!-- Review Button -->
                        <a href="{{ url_for('submit_review', course_id=course.course.id) }}" class="btn btn-primary btn-sm">Review</a>
                    </div>
                </li>
            {% endfor %}
        </ul>
        <a href="{{ url_for('client_dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
    </div>
</body>
</html>
