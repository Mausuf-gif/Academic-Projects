
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Your Car Appointment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Book Your Car Appointment</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul>{% for msg in messages %}<li>{{ msg }}</li>{% endfor %}</ul>
      {% endif %}
    {% endwith %}
    <form method="post" action="{{ url_for('book') }}">
        <input name="name" placeholder="Name" required><br><br>
        <textarea name="address" placeholder="Address" required></textarea><br><br>
        <input name="phone" placeholder="Phone" required><br><br>
        <input name="car_license" placeholder="Car License No." required><br><br>
        <input name="car_engine" placeholder="Car Engine No." required><br><br>
        <input type="date" name="appointment_date" required><br><br>
        <select name="mechanic" required>
            <option value="">-- Select Mechanic --</option>
            {% for m in mechanics %}
                <option value="{{ m.id }}">{{ m.name }} ({{ mechanic_slots[m.id] }} slots left)</option>
            {% endfor %}
        </select><br><br>
        <button type="submit">Book Appointment</button>
    </form>
</body>
</html>
